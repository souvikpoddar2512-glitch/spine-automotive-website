<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#334155" stroke-width=".75" opacity=".35"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#26364B"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#bg)"/>
  <rect width="800" height="450" rx="12" fill="url(#grid)"/>

  <!-- Header: model name only -->
  <text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#F97316">SCHEMATIC · SW-403A</text>
  <text x="768" y="42" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing=".8" fill="#94A3B8">SIDEWALL TRAILER</text>
  <line x1="32" y1="58" x2="768" y2="58" stroke="#475569" stroke-width="1"/>

  <!-- Sidewall body -->
  <path d="M112 130 L724 130 L724 269 L112 269 Z"
        fill="url(#panel)" stroke="#38BDF8" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Top rail and lower sill -->
  <path d="M108 128H728V139H108Z" fill="#94A3B8" stroke="#CBD5E1" stroke-width="1"/>
  <path d="M108 260H728V275H108Z" fill="#334155" stroke="#7DD3FC" stroke-width="1.5"/>

  <!-- Front bulkhead / headboard -->
  <path d="M112 130H145V260H112Z" fill="#64748B" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M119 140V250M136 140V250" stroke="#94A3B8" stroke-width="2"/>

  <!-- Sidewall panels with vertical ribs -->
  <g stroke="#94A3B8" stroke-width="2" opacity=".95">
    <path d="M165 141V258M205 141V258M245 141V258M285 141V258M325 141V258M365 141V258M405 141V258M445 141V258M485 141V258M525 141V258M565 141V258M605 141V258M645 141V258M685 141V258"/>
  </g>
  <g stroke="#1E293B" stroke-width="1" opacity=".9">
    <path d="M169 142V257M209 142V257M249 142V257M289 142V257M329 142V257M369 142V257M409 142V257M449 142V257M489 142V257M529 142V257M569 142V257M609 142V257M649 142V257M689 142V257"/>
  </g>

  <!-- Panel seams and latch details -->
  <path d="M151 196H714" stroke="#64748B" stroke-width="1" opacity=".65"/>
  <g fill="#F97316">
    <rect x="177" y="186" width="5" height="20" rx="1"/>
    <rect x="257" y="186" width="5" height="20" rx="1"/>
    <rect x="337" y="186" width="5" height="20" rx="1"/>
    <rect x="417" y="186" width="5" height="20" rx="1"/>
    <rect x="497" y="186" width="5" height="20" rx="1"/>
    <rect x="577" y="186" width="5" height="20" rx="1"/>
    <rect x="657" y="186" width="5" height="20" rx="1"/>
  </g>

  <!-- Rear gate and hinges -->
  <path d="M695 139H720V259H695Z" fill="#334155" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M702 146V252M713 146V252" stroke="#94A3B8" stroke-width="2"/>
  <g fill="#F97316">
    <rect x="697" y="158" width="7" height="12" rx="1"/>
    <rect x="697" y="220" width="7" height="12" rx="1"/>
  </g>

  <!-- Chassis -->
  <path d="M105 275H738V304H105Z" fill="#0B1220" stroke="#64748B" stroke-width="2"/>
  <path d="M115 282H730" stroke="#F97316" stroke-width="2" stroke-dasharray="12 7"/>
  <g stroke="#38BDF8" stroke-width="1.4" opacity=".85">
    <path d="M180 276V302M240 276V302M300 276V302M360 276V302M420 276V302M480 276V302"/>
  </g>

  <!-- Landing legs -->
  <g>
    <rect x="220" y="274" width="10" height="55" fill="#64748B" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="244" y="274" width="10" height="55" fill="#64748B" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M215 327H235V334H215ZM239 327H259V334H239Z" fill="#F97316"/>
    <path d="M225 285L249 309M249 285L225 309" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Three axle suspension and wheels -->
  <g transform="translate(535 315)">
    <path d="M-32 -29Q0 -43 32 -29" fill="none" stroke="#F97316" stroke-width="3"/>
    <rect x="-17" y="-34" width="34" height="8" rx="2" fill="#475569"/>
    <circle r="37" fill="#080D16" stroke="#64748B" stroke-width="4"/>
    <circle r="23" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <circle r="8" fill="#EA580C"/><circle r="3" fill="#F8FAFC"/>
    <g fill="#CBD5E1"><circle cx="-14" cy="0" r="2"/><circle cx="14" cy="0" r="2"/><circle cx="0" cy="-14" r="2"/><circle cx="0" cy="14" r="2"/></g>
  </g>
  <g transform="translate(615 315)">
    <path d="M-32 -29Q0 -43 32 -29" fill="none" stroke="#F97316" stroke-width="3"/>
    <rect x="-17" y="-34" width="34" height="8" rx="2" fill="#475569"/>
    <circle r="37" fill="#080D16" stroke="#64748B" stroke-width="4"/>
    <circle r="23" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <circle r="8" fill="#EA580C"/><circle r="3" fill="#F8FAFC"/>
    <g fill="#CBD5E1"><circle cx="-14" cy="0" r="2"/><circle cx="14" cy="0" r="2"/><circle cx="0" cy="-14" r="2"/><circle cx="0" cy="14" r="2"/></g>
  </g>
  <g transform="translate(695 315)">
    <path d="M-32 -29Q0 -43 32 -29" fill="none" stroke="#F97316" stroke-width="3"/>
    <rect x="-17" y="-34" width="34" height="8" rx="2" fill="#475569"/>
    <circle r="37" fill="#080D16" stroke="#64748B" stroke-width="4"/>
    <circle r="23" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <circle r="8" fill="#EA580C"/><circle r="3" fill="#F8FAFC"/>
    <g fill="#CBD5E1"><circle cx="-14" cy="0" r="2"/><circle cx="14" cy="0" r="2"/><circle cx="0" cy="-14" r="2"/><circle cx="0" cy="14" r="2"/></g>
  </g>

  <!-- Rear underrun guard and lights -->
  <rect x="735" y="273" width="8" height="60" fill="#EA580C"/>
  <rect x="723" y="329" width="29" height="7" rx="1" fill="#EF4444"/>

  <!-- Ground line -->
  <line x1="78" y1="360" x2="760" y2="360" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Footer: descriptive text added; main trailer drawing above remains unchanged -->
  <text x="32" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing=".4" fill="#F1F5F9">SIDEWALL TRAILER</text>
  <text x="32" y="411" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#94A3B8">Heavy-duty sidewall construction with reinforced panels for secure, versatile cargo transportation</text>
  <text x="32" y="430" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing=".4" fill="#F97316">BUILT FOR STRENGTH, DRIVEN BY QUALITY</text>
  <text x="768" y="430" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing=".4" fill="#F97316">SPINE AUTOMOTIVE</text>
</svg>