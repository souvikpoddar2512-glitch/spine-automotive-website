<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="title desc">
  <title id="title">40 Foot Container and General Cargo Flatbed Trailer</title>
  <desc id="desc">Industrial technical illustration of a flatbed semi-trailer with front headboard, container twistlocks, chassis beam, landing legs, kingpin, tandem wheels and lateral protection rail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#64748B" stroke-width=".7" opacity=".22"/>
    </pattern>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#bg)"/>
  <rect width="800" height="450" rx="12" fill="url(#grid)"/>

  <!-- Unboxed header, matching the chassis and tipper illustrations -->
  <text x="34" y="43" fill="#F97316" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">SCHEMATIC · FB-40S</text>
  <text x="766" y="43" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" letter-spacing=".7">40 FT FLATBED</text>
  <path d="M34 58H766" stroke="#475569" stroke-width="1" opacity=".75"/>

  <!-- Front headboard -->
  <rect x="128" y="132" width="19" height="78" rx="2" fill="#C2410C" stroke="#F97316" stroke-width="2"/>
  <g stroke="#FDBA74" stroke-width="1.2">
    <path d="M130 151H145 M130 171H145 M130 191H145"/>
  </g>

  <!-- Flat deck platform -->
  <rect x="147" y="204" width="570" height="15" rx="2" fill="url(#deck)" stroke="#38BDF8" stroke-width="2"/>
  <path d="M154 209H709" stroke="#94A3B8" stroke-width="1" opacity=".65"/>

  <!-- Container twistlocks -->
  <g fill="#F97316" stroke="#FDBA74" stroke-width=".8">
    <rect x="160" y="195" width="15" height="9" rx="1"/>
    <rect x="423" y="195" width="15" height="9" rx="1"/>
    <rect x="686" y="195" width="15" height="9" rx="1"/>
  </g>
  <g fill="#FDBA74" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle">
    <text x="167.5" y="187">TL 1</text>
    <text x="430.5" y="187">TL 2</text>
    <text x="693.5" y="187">TL 3</text>
  </g>

  <!-- Main chassis beam and cross members -->
  <path d="M145 219H710V246H238L220 230H145Z" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
  <path d="M238 225H703" stroke="#F97316" stroke-width="2"/>
  <g stroke="#64748B" stroke-width="3">
    <path d="M300 220V245 M365 220V245 M470 220V245 M510 220V245"/>
  </g>

  <!-- Kingpin and landing legs -->
  <path d="M170 219V237H184V219" fill="#C2410C" stroke="#F97316" stroke-width="1.5"/>
  <g>
    <rect x="248" y="246" width="13" height="65" rx="1" fill="#64748B" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="242" y="307" width="25" height="7" rx="2" fill="#F97316"/>
    <path d="M244 253H265" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- Side protection rail and supports -->
  <path d="M285 276H494" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#94A3B8" stroke-width="2.2">
    <path d="M320 246V282 M460 246V282"/>
  </g>
  <text x="389" y="295" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" letter-spacing=".25">AIS-130 LATERAL PROTECTION</text>

  <!-- Tandem wheels -->
  <g transform="translate(560 300)">
    <circle r="36" fill="#0B0F19" stroke="#64748B" stroke-width="4"/>
    <circle r="23" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <circle r="9" fill="#F97316"/>
    <circle r="3" fill="#CBD5E1"/>
    <path d="M0 -18V-10 M18 0H10 M0 18V10 M-18 0H-10" stroke="#64748B" stroke-width="2"/>
  </g>
  <g transform="translate(650 300)">
    <circle r="36" fill="#0B0F19" stroke="#64748B" stroke-width="4"/>
    <circle r="23" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <circle r="9" fill="#F97316"/>
    <circle r="3" fill="#CBD5E1"/>
    <path d="M0 -18V-10 M18 0H10 M0 18V10 M-18 0H-10" stroke="#64748B" stroke-width="2"/>
  </g>
  <path d="M526 262Q560 275 594 262Q625 275 682 262" fill="none" stroke="#F97316" stroke-width="2.5"/>

  <!-- Ground reference and technical annotation -->
  <path d="M96 342H744" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="400" y="358" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" letter-spacing=".4">CONTAINER TWISTLOCKS · HEAVY-DUTY CHASSIS · TANDEM AXLE CONFIGURATION</text>

  <!-- Footer with separated baselines -->
  <text x="34" y="389" fill="#F1F5F9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing=".15">40 FT CONTAINER &amp; GENERAL CARGO FLATBED</text>
  <text x="34" y="411" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="10.5">Engineered for 1 × 40 ft or 2 × 20 ft ISO containers and heavy steel coils</text>
  <text x="34" y="430" fill="#F97316" font-family="Arial, Helvetica, sans-serif" font-size="10">High-yield main web · Chequered steel / hardwood flooring options</text>
</svg>