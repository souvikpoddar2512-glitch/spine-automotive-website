<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad2)" rx="12"/>
  <rect width="800" height="450" fill="url(#grid2)" rx="12"/>
  
  <rect x="30" y="30" width="190" height="34" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="42" y="52" font-family="'Inter', monospace" font-size="12" fill="#F97316" font-weight="700">SCHEMATIC: FB-40S</text>
  <text x="145" y="52" font-family="'Inter', monospace" font-size="11" fill="#94A3B8">40FT FLATBED</text>

  <!-- Side-profile: Flatbed Trailer with Twistlocks & Headboard -->
  <!-- Heavy Front Bulkhead / Headboard -->
  <rect x="130" y="140" width="16" height="80" fill="#EA580C" stroke="#F97316" stroke-width="1.5" rx="2"/>
  <line x1="130" y1="160" x2="146" y2="160" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="130" y1="180" x2="146" y2="180" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="130" y1="200" x2="146" y2="200" stroke="#FFFFFF" stroke-width="1"/>

  <!-- Flat Deck Platform -->
  <rect x="130" y="215" width="590" height="15" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Container Twistlocks (ISO standard positions) -->
  <rect x="140" y="208" width="14" height="8" fill="#F97316"/>
  <rect x="420" y="208" width="14" height="8" fill="#F97316"/>
  <rect x="700" y="208" width="14" height="8" fill="#F97316"/>
  <text x="147" y="202" font-family="'Inter', sans-serif" font-size="9" fill="#F97316" text-anchor="middle">TL 1</text>
  <text x="427" y="202" font-family="'Inter', sans-serif" font-size="9" fill="#F97316" text-anchor="middle">TL 2</text>
  <text x="707" y="202" font-family="'Inter', sans-serif" font-size="9" fill="#F97316" text-anchor="middle">TL 3</text>

  <!-- Main Chassis Beam underneath -->
  <path d="M 140 230 L 230 230 L 250 255 L 710 255 L 710 275 L 245 275 L 225 240 L 140 240 Z" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  
  <!-- Kingpin and Landing Legs -->
  <rect x="165" y="240" width="14" height="20" fill="#EA580C"/>
  <rect x="250" y="275" width="12" height="55" fill="#64748B"/>
  <rect x="246" y="325" width="20" height="8" fill="#F97316" rx="2"/>

  <!-- Axles & Dual Wheels -->
  <g transform="translate(560, 290)">
    <circle cx="0" cy="0" r="42" fill="#0B0F19" stroke="#64748B" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#EA580C"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(650, 290)">
    <circle cx="0" cy="0" r="42" fill="#0B0F19" stroke="#64748B" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#EA580C"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Suspension springs -->
  <path d="M 525 272 Q 560 284 595 272 Q 625 284 680 272" fill="none" stroke="#F97316" stroke-width="3"/>

  <!-- Side Protection Rail (AIS 130 Compliance) -->
  <line x1="280" y1="295" x2="500" y2="295" stroke="#EA580C" stroke-width="4"/>
  <line x1="320" y1="275" x2="320" y2="305" stroke="#64748B" stroke-width="2"/>
  <line x1="460" y1="275" x2="460" y2="305" stroke="#64748B" stroke-width="2"/>
  <text x="390" y="315" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">AIS-130 LATERAL PROTECTION</text>

  <!-- Ground Line -->
  <line x1="100" y1="334" x2="740" y2="334" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g transform="translate(30, 370)">
    <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">40FT CONTAINER &amp; GENERAL CARGO FLATBED</text>
    <text x="0" y="34" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Engineered for 1x40ft or 2x20ft ISO Containers &amp; Heavy Steel Coils | High Yield Main Web</text>
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="10" fill="#F97316">Fabricated at Adityapur Plant • Heavy-duty Chequered / Hardwood Flooring Options</text>
  </g>
</svg>
