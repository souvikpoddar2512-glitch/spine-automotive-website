<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="title desc">
  <title id="title">Custom Structural Chassis and Sub-Assemblies</title>
  <desc id="desc">Technical illustration of a heavy-duty ladder chassis frame with cross members, diagonal bracing and outriggers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#64748B" stroke-width=".7" opacity=".22"/>
    </pattern>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#bg)"/>
  <rect width="800" height="450" rx="12" fill="url(#grid)"/>

  <!-- Header: deliberately unboxed, with independent text areas -->
  <text x="34" y="43" fill="#F97316" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">FABRICATION · CH-FRAME</text>
  <text x="766" y="43" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" letter-spacing=".7">CHASSIS &amp; SUB-ASSEMBLIES</text>
  <path d="M34 58H766" stroke="#475569" stroke-width="1" opacity=".75"/>

  <!-- Ladder-frame chassis, top view -->
  <g transform="translate(100 112)">
    <!-- Main longitudinal rails -->
    <rect x="0" y="24" width="600" height="20" rx="3" fill="url(#rail)" stroke="#F97316" stroke-width="2.2"/>
    <rect x="0" y="164" width="600" height="20" rx="3" fill="url(#rail)" stroke="#F97316" stroke-width="2.2"/>

    <!-- Cross members -->
    <g fill="#0F172A" stroke="#38BDF8" stroke-width="1.8">
      <rect x="24" y="44" width="18" height="120" rx="1"/>
      <rect x="126" y="44" width="16" height="120" rx="1"/>
      <rect x="228" y="44" width="22" height="120" rx="1" stroke="#F97316"/>
      <rect x="330" y="44" width="22" height="120" rx="1" stroke="#F97316"/>
      <rect x="432" y="44" width="16" height="120" rx="1"/>
      <rect x="558" y="44" width="20" height="120" rx="1" stroke="#F97316"/>
    </g>

    <!-- Mounting / lightening details -->
    <g fill="#F97316">
      <circle cx="134" cy="104" r="4"/>
      <circle cx="239" cy="68" r="3"/>
      <circle cx="239" cy="140" r="3"/>
      <circle cx="341" cy="68" r="3"/>
      <circle cx="341" cy="140" r="3"/>
      <circle cx="568" cy="68" r="3"/>
      <circle cx="568" cy="140" r="3"/>
    </g>

    <!-- Diagonal reinforcement in bogie area -->
    <g fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="5 4" opacity=".95">
      <path d="M250 46L330 162"/>
      <path d="M330 46L250 162"/>
    </g>

    <!-- Outriggers -->
    <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round">
      <path d="M126 24V5 M228 24V5 M330 24V5 M432 24V5 M534 24V5"/>
      <path d="M126 184V203 M228 184V203 M330 184V203 M432 184V203 M534 184V203"/>
    </g>
    <g fill="#64748B">
      <rect x="116" y="0" width="20" height="5" rx="2"/>
      <rect x="218" y="0" width="20" height="5" rx="2"/>
      <rect x="320" y="0" width="20" height="5" rx="2"/>
      <rect x="422" y="0" width="20" height="5" rx="2"/>
      <rect x="524" y="0" width="20" height="5" rx="2"/>
      <rect x="116" y="203" width="20" height="5" rx="2"/>
      <rect x="218" y="203" width="20" height="5" rx="2"/>
      <rect x="320" y="203" width="20" height="5" rx="2"/>
      <rect x="422" y="203" width="20" height="5" rx="2"/>
      <rect x="524" y="203" width="20" height="5" rx="2"/>
    </g>
  </g>

  <!-- Engineering callout -->
  <path d="M100 338H700" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="5 5" opacity=".9"/>
  <text x="400" y="329" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" letter-spacing=".45">SUBMERGED-ARC-WELDED I-BEAM · HIGH-YIELD FLANGES</text>

  <!-- Footer copy: each line has its own baseline and safe vertical spacing -->
  <text x="34" y="378" fill="#F1F5F9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing=".25">CUSTOM STRUCTURAL CHASSIS &amp; SUB-ASSEMBLIES</text>
  <text x="34" y="402" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="10.5">Engineered for torsional rigidity and low tare weight</text>
  <text x="34" y="422" fill="#F97316" font-family="Arial, Helvetica, sans-serif" font-size="10.5">Precision CNC plasma cutting · Automated SAW welding</text>
</svg>